The Sorrento Meeting will be held at the <a href="https://www.vesuviosorrento.com/">Grand Hotel Vesuvio</a> in Sorrento, Italy from 30th of March to 1st April 2026.

The meeting will have a mix of workshops and a plenary session focused on the Future of Machine Learning Publishing.
